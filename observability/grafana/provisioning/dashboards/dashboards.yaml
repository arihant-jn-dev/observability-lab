apiVersion: 1

providers:
  - name: obslab
    orgId: 1
    folder: "Observability Lab"
    type: file
    disableDeletion: false
    # Picks up edits to the JSON files without restarting Grafana. If you change
    # a dashboard in the UI, use Export -> Save to file to persist it here,
    # otherwise the next reload overwrites your change.
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
